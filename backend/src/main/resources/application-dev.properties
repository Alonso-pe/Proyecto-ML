# Development profile - in-memory H2 DB and safe defaults
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use safer defaults in dev; allow overriding with environment variables
migo.api.url=${MIGO_API_URL:https://api.migo.pe/api/v1/dni}
migo.api.token=ySRwqAAYJbH0oei6CGqz7qxGf9BoKszkoHFkJlFYK6bEBoESKHTYZIWln1qU
# JWT (use a different secret in dev or set via env)
jwt.secret=${JWT_SECRET:dev-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Optional: development security user (overrides default generated password)
spring.security.user.name=devuser
spring.security.user.password=devpass
